name: build
on:
  workflow_dispatch:
    inputs:
      source-repository:
        description: Source repository (owner/name)
        required: true
        type: string
      source-sha:
        description: Full lowercase 40-character source commit SHA
        required: true
        type: string
      source-tag:
        description: Raw source tag verified by the bridge (empty for snapshots)
        required: false
        default: ""
        type: string
permissions:
  contents: read
jobs:
  build:
    if: inputs.source-repository == 'slopization/linux-cv181x-sodoport'
    # Release shared CI v2 before enabling this caller remotely.
    uses: slopization/debian-ci/.github/workflows/package.yml@v2
    with:
      source-repository: ${{ inputs.source-repository }}
      source-sha: ${{ inputs.source-sha }}
      source-tag: ${{ inputs.source-tag }}
      recipe-repository: ${{ github.repository }}
      # Immutable packaging commit, deliberately preceding caller-only changes.
      recipe-sha: fc661a0128622120d08c95fb2c1793db0f3836bc
      suite: trixie
      host-arch: riscv64
